name: Build Dash for iOS 12

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz dpkg make

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Select Xcode 14.2 (iOS 12 support)
        run: sudo xcode-select -s /Applications/Xcode_14.2.app

      - name: Build deb
        working-directory: ./Dash
        env:
          THEOS: ${{ env.THEOS }}
        run: make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dash-iOS12-arm64
          path: Dash/packages/*.deb
          retention-days: 30
